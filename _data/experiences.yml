- role: "Graduate Research Assistant"
  organization: "Hildebrand Department of Petroleum & Geosystems Engineering, UT Austin"
  organization_url: "https://sites.google.com/utexas.edu/masha/people?authuser=0"
  period: "Aug 2024 – Present"
  current: true
  supervisor: "Prof. Maša Prodanović"
  supervisor_url: "https://pge.utexas.edu/facultystaff/faculty-directory/prodanovic"
  tags: ["Digital Rock Physics", "LBM", "CCUS", "UHS", "Python"]
  images:
    - /images/gra2.png
    - /images/gra3.png
    - /images/gra4.png
  projects:
    - title: "BayesFracX"
      description: >-
        Open-source Python framework for automated extraction and
        characterization of individual fractures from segmented 3D X-ray
        CT images. Combines Dirichlet-Process Bayesian Gaussian Mixture
        Modeling (DP-BGMM) with iterative geometric validation and
        full-resolution reconstruction to identify and separate complex
        fracture networks. Quantifies fracture orientation, geometry,
        size, and spatial aperture distributions, generating DFN-ready
        representations for subsequent numerical modeling. Validated
        using synthetic fracture networks and experimental datasets from
        the [Digital Porous Media](https://www.digitalporousmedia.org/)
        portal. Source code available on
        [GitHub](https://github.com/MatheosG/BayesFracX).
        Manuscript currently under review in *Computers & Geosciences*.
        
    - title: "Multiscale Particulate Transport in Fracture Networks"
      description: >-
        Investigates finite-size particle transport in CT-derived fracture
        networks using coupled CFD–DEM simulations (OpenFOAM, LIGGGHTS,
        CFDEMcoupling). Examines how fracture roughness, aperture variability,
        and geometric simplification affect particle transmission, retention,
        bridging, and clogging. Integrates BayesFracX fracture characterization
        with statistical DFN upscaling (pySimFrac, dfnWorks) to develop
        particle-transport closure relationships for larger-scale simulations.

    - title: "Marangoni-Driven Drainage of Residual Oil Films"
      description: >-
        Developed a fully coupled phase-field lattice Boltzmann
        framework to simulate surfactant-driven mobilization and
        drainage of residual oil films at the pore scale.
        Integrates two-phase hydrodynamics, interfacial surfactant
        transport, concentration-dependent surface tension,
        Marangoni stresses, and wettability effects.
        Investigates the combined influence of fluid flow and
        Marangoni forces on oil displacement and recovery
        from oil-wet porous media. Presented at the 2026
        Gordon Research Conference on Flow and Transport
        in Permeable Media.


- role: "Researcher — Technologies for the Energy Transition"
  organization: "Fondazione Eni Enrico Mattei (FEEM)"
  organization_url: "https://www.feem.it/ricerca/programmi/technologies-for-the-energy-transition/"
  period: "Sep 2023 – Sep 2024"
  tags: ["Game Theory", "PLEXOS", "Energy Economics", "Stochastic Modeling"]
  images:
    - /images/feem.png
  projects:
    - title: "Coupling Game Theory with Reservoir Models"
      description: >-
        Framework to evaluate coordination and utility of CCUS and UHS value-chain
        stakeholders. At the 45th IAEE, introduced the price of CO₂ as an energy
        commodity, moving beyond the carbon-tax framing. Demonstrated that a CCUS
        infrastructure in Cyprus's Aphrodite Gas Field could generate positive NPV
        for emitters and O&G producers with limited government subsidy.
        Methodology now being implemented in the Ravenna CCS hub (Eni SpA) for
        emitters in Lombardy, Veneto, and Emilia Romagna.

    - title: "Decarbonization of a Residential House in the EU"
      description: >-
        Designed insulation and PV system for a Net-Zero upgrade of a house in
        Limassol, Cyprus. Turned the groundwork into a novel stochastic cashflow
        model for project profitability. Now generalizing the model across the
        whole Cyprus market using behavioral-economics-informed input distributions.

    - title: "Energy Transition Modeling in PLEXOS"
      description: >-
        Consultancy on modeling European electricity and gas markets in
        [PLEXOS](https://www.energyexemplar.com/plexos) for [CESI](https://www.cesi.it/)
        and the [World Bank](https://www.worldbank.org/en/home) on the
        [Black Sea Electricity Project](https://www.euronews.com/2022/12/17/hungary-romania-georgia-azerbaijan-agree-to-black-sea-electricity-project).
        Built a Python .NET automation pipeline for end-to-end PLEXOS project
        execution from input to visualization.

